name: Codi Semantic Memory Index
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/vector-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shared XOS vector sync worker
        run: curl -fsSL https://raw.githubusercontent.com/XLR8ROS/xlr8ros-hq/main/scripts/xos_vector_sync.py -o /tmp/xos_vector_sync.py
      - name: Sync Codi semantic memory index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XOS_VECTOR_STORE_NAME: xos-agent-codi
          XOS_VECTOR_SCOPE: agent:codi
          XOS_VECTOR_VISIBILITY: private-agent
          XOS_REPOSITORY: XLR8ROS/CodiCore
          XOS_INCLUDE_GLOBS: '**/*.md;*.md'
          XOS_EXCLUDE_GLOBS: 'Archive/**;archive/**;archives/**;Outputs/**'
        run: python3 /tmp/xos_vector_sync.py
