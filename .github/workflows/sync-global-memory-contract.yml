name: Sync Global Memory Contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-global-memory-contract
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out local agent repository
        uses: actions/checkout@v4

      - name: Pull canonical contract from XOS HQ
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/XLR8ROS/xlr8ros-hq/main/Global%20Memory%20Contract.md"             --output "$tmp"

          if [ ! -f "Global Memory Contract.md" ] || ! cmp -s "$tmp" "Global Memory Contract.md"; then
            cp "$tmp" "Global Memory Contract.md"
            changed=1
          else
            changed=0
          fi

          if [ ! -f "Global Memory Contract.metadata.md" ]; then
            changed=1
          fi

          if [ "$changed" -eq 1 ]; then
            hq_commit="$(git ls-remote https://github.com/XLR8ROS/xlr8ros-hq.git refs/heads/main | awk '{print $1}')"
            local_blob="$(git hash-object "Global Memory Contract.md")"
            cat > "Global Memory Contract.metadata.md" <<EOF
# Global Memory Contract synchronization metadata

This file is not governing contract text.

- Canonical source: `XLR8ROS/xlr8ros-hq/Global Memory Contract.md`
- Synchronization direction: HQ -> local
- HQ main commit observed during sync: `$hq_commit`
- Verified local Git blob SHA after sync: `$local_blob`
- Synchronization workflow: `.github/workflows/sync-global-memory-contract.yml`
EOF
          fi

          rm -f "$tmp"

      - name: Commit synchronization repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "Global Memory Contract.md" "Global Memory Contract.metadata.md"              && git diff --cached --quiet; then
            echo "Local contract already matches HQ."
            exit 0
          fi

          git config user.name "xos-memory-sync"
          git config user.email "xos-memory-sync@users.noreply.github.com"
          git add "Global Memory Contract.md" "Global Memory Contract.metadata.md"
          git commit -m "Sync Global Memory Contract from XOS HQ"
          git push
